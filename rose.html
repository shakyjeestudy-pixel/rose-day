<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Rose Day ❤️</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(120deg, #ffdde1, #ee9ca7);
        overflow: hidden;
        text-align: center;
        color: white;
    }

    /* dreamy blur layer */
    body::before{
        content:"";
        position:fixed;
        inset:0;
        backdrop-filter: blur(8px);
        z-index:-1;
    }

    h1 {
        margin-top: 80px;
        font-size: 50px;
        animation: fadeIn 3s ease-in-out, heartbeat 1.5s infinite;
        text-shadow: 0 0 20px rgba(255,255,255,0.8);
    }

    @keyframes heartbeat{
        0%,100%{transform:scale(1);}
        50%{transform:scale(1.06);}
    }

    #message {
        font-size: 24px;
        width: 80%;
        margin: 30px auto;
        min-height: 120px;
    }

    button {
        padding: 15px 35px;
        font-size: 20px;
        border: none;
        border-radius: 30px;
        background: white;
        color: #e91e63;
        cursor: pointer;
        transition: 0.3s;
        box-shadow:0 0 20px rgba(255,255,255,0.7);
    }

    button:hover {
        transform: scale(1.1);
        background: #ffe6ec;
    }

    .rose, .sparkle {
        position: absolute;
        top: -50px;
        font-size: 30px;
        animation: fall linear infinite;
    }

    .sparkle{
        font-size:18px;
        opacity:0.8;
    }

    @keyframes fall {
        to { transform: translateY(110vh); }
    }
</style>
</head>

<body>

<h1>🌹 Happy Rose Day, <span id="name">Ishika</span> 🌹</h1>

<div id="message"></div>

<button onclick="startLove()">Open My Heart ❤️</button>

<audio id="bgMusic"></audio>

<script>
/* ===== Auto Name From URL ===== */
const urlParams = new URLSearchParams(window.location.search);
const personName = urlParams.get('name');
if(personName){
    document.getElementById("name").innerText = personName;
}

/* ===== Love Message ===== */
const text = "Even though miles separate us, my love for you blooms like the most beautiful rose every single day. You are my happiness, my heart, and my forever. Happy Rose Day ❤️";

let i = 0;

/* ===== Playlist ===== */
const songs = ["raabta.mp3","khuda_jaane.mp3"];
let currentSong = 0;
const audio = document.getElementById("bgMusic");

function startLove() {
    playSong();
    typeWriter();
}

function playSong() {
    audio.src = songs[currentSong];
    audio.play();
    audio.onended = () => {
        currentSong = (currentSong + 1) % songs.length;
        playSong();
    };
}

/* ===== Typewriter ===== */
function typeWriter() {
    if (i < text.length) {
        document.getElementById("message").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
    }
}

/* ===== Roses ===== */
function createRose() {
    const rose = document.createElement("div");
    rose.classList.add("rose");
    rose.innerHTML = "🌹";
    rose.style.left = Math.random() * window.innerWidth + "px";
    rose.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(rose);
    setTimeout(() => rose.remove(), 6000);
}

/* ===== Sparkles ===== */
function createSparkle() {
    const s = document.createElement("div");
    s.classList.add("sparkle");
    s.innerHTML = "✨";
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.animationDuration = (Math.random() * 3 + 2) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 5000);
}

setInterval(createRose, 300);
setInterval(createSparkle, 500);
</script>

</body>
</html>
